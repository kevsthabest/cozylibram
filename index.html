<!-- v560: fonts are vendored (assets/fonts/ + @font-face in styles.css) —
     no runtime font CDN. -->
<script>
/* v543: pre-paint theme boot. styles.css's :root defaults ARE the Dark theme
   (violet accent), and data-theme is only set when js/010-theming.js runs at
   end-of-body — so every non-Dark theme flashed purple for the first frame(s)
   on load/refresh. This inline mirror resolves the stored theme + accent
   exactly as js/010's getTheme()/applyTheme() do and sets the attributes
   before first paint. js/010 remains authoritative and re-applies when it
   loads; this script only removes the flash. Keep THEME_KEYS in sync with
   THEMES in js/010-theming.js (pinned by .test/boot-theme.test.js). Any
   failure (storage unavailable, private mode) leaves today's behaviour. */
(function () {
  try {
    var THEME_KEYS = ['dark', 'light', 'hearthside', 'candlelight', 'twilight', 'verdant', 'midnight', 'velvet', 'abyss', 'frost', 'haunt', 'yuletide', 'fete', 'amour', 'shamrock', 'pastel', 'harvest', 'solstice', 'stormrider', 'briarthrone', 'voidsignal', 'wisp', 'wisp-night'];
    var t = localStorage.getItem('theme');
    /* js/010: an unknown/missing theme falls back to Dark, and an unset
       data-theme IS Dark (styles.css :root == [data-theme="dark"]) — so
       only a validated stored key is set here. */
    if (t && THEME_KEYS.indexOf(t) !== -1) document.documentElement.dataset.theme = t;
    /* js/010 applyTheme(): a stored accent pick is mirrored raw into
       data-accent (CSS [data-accent] blocks consume it); none stored ->
       no attribute, and the theme's own designed --accent wins. */
    var a = localStorage.getItem('accent');
    if (a) document.documentElement.dataset.accent = a;
    /* v571: book-dressing mirror (js/240). The library can't be read
       synchronously pre-paint, so js/240 stores its last resolved dressed
       accent in localStorage; re-apply it here as inline --accent /
       --accent-deep so a dressed reader never flashes the undressed
       theme. js/240 re-resolves authoritatively once the library loads
       (enterApp) and corrects or clears a stale mirror. Skipped entirely
       when the dressing toggle is off. */
    if (localStorage.getItem('cozylibram.bookdress') !== 'off') {
      var bda = localStorage.getItem('cozylibram.bookdress.applied');
      if (bda) {
        var bdp = JSON.parse(bda);
        var de = document.documentElement;
        if (bdp && /^#[0-9a-f]{6}$/i.test(bdp.accent || '') && de.style && de.style.setProperty) {
          de.style.setProperty('--accent', bdp.accent);
          if (/^#[0-9a-f]{6}$/i.test(bdp.deep || '')) de.style.setProperty('--accent-deep', bdp.deep);
          de.dataset.dressed = 'boot';
        }
      }
    }
  } catch (e) { /* storage unavailable — js/010's defaults apply, as before */ }
})();
</script>

<script>
/* v560: service worker gate. Inside a native shell (Capacitor) the shell
   owns the app lifecycle and update path, so the PWA service worker must
   not register there. The marker is the shell's own bridge: window.Capacitor
   present and reporting a native platform. Capacitor present but lacking
   isNativePlatform still counts as a shell (the bridge object alone is not
   something a plain browser ever sets); every other case — no bridge, web
   platform, a bridge that throws — registers exactly as before. Conservative
   by design: any doubt means today's behaviour. Pinned by
   .test/capacitor-readiness.test.js. */
window.cozyInNativeShell = function () {
  try {
    var C = window.Capacitor;
    if (!C) return false;
    if (typeof C.isNativePlatform !== 'function') return true;
    return !!C.isNativePlatform();
  } catch (e) { return false; }
};
if (!window.cozyInNativeShell() && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
