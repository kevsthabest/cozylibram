<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YOLO Book Test</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { pointer-events: none; }
  #ui { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  #status { font-size: 14px; margin-bottom: 10px; min-height: 20px; color: #8f8; }
  #results { font-size: 13px; margin-bottom: 10px; max-height: 120px; overflow-y: auto; }
  #results div { padding: 2px 0; }
  .btnrow { display: flex; gap: 10px; }
  button { flex: 1; padding: 14px; font-size: 16px; border: none; border-radius: 12px; background: #e91e63; color: #fff; font-weight: 600; }
  button.ghost { background: #333; }
  button:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="ui">
    <div id="status">Tap Start to begin.</div>
    <div id="results"></div>
    <div class="btnrow">
      <button id="startBtn">Start camera</button>
      <button id="detectBtn" class="ghost" disabled>Detect</button>
    </div>
  </div>
</div>
<script>
'use strict';
const IMG = 640, CONF = 0.15, NMS_IOU = 0.5;
const COCO = ['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush'];
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const startBtn = document.getElementById('startBtn');
const detectBtn = document.getElementById('detectBtn');
let session = null, sessionReady = false;

const sig = x => 1 / (1 + Math.exp(-x));
function setStatus(t, ok) { statusEl.textContent = t; statusEl.style.color = ok === false ? '#f88' : '#8f8'; }

async function loadModel() {
  setStatus('Loading YOLO model (12MB)…');
  try {
    session = await ort.InferenceSession.create('yolo11n-seg.onnx', { executionProviders: ['wasm'] });
    sessionReady = true;
    setStatus('Model ready. Point at a book and tap Detect.');
    detectBtn.disabled = false;
  } catch (e) {
    setStatus('Model failed to load: ' + e.message, false);
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = s;
    await video.play();
    setStatus('Camera on. Loading model…');
    loadModel();
  } catch (e) {
    setStatus('Camera failed: ' + e.message, false);
    startBtn.disabled = false;
  }
});

function nms(boxes, scores) {
  const idx = boxes.map((_, i) => i).sort((a, b) => scores[b] - scores[a]);
  const keep = [], sup = new Array(boxes.length).fill(false);
  for (const i of idx) {
    if (sup[i]) continue;
    keep.push(i);
    for (const j of idx) {
      if (j === i || sup[j]) continue;
      const a = boxes[i], b = boxes[j];
      const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]));
      const iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
      const inter = ix * iy;
      const union = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
      if (union > 0 && inter / union > NMS_IOU) sup[j] = true;
    }
  }
  return keep;
}

detectBtn.addEventListener('click', async () => {
  if (!sessionReady) return;
  detectBtn.disabled = true;
  setStatus('Running detection…');
  const t0 = performance.now();
  try {
    const vw = video.videoWidth, vh = video.videoHeight;
    // square crop from center, resized to 640
    const side = Math.min(vw, vh);
    const sx = (vw - side) / 2, sy = (vh - side) / 2;
    const c = document.createElement('canvas'); c.width = c.height = IMG;
    const cx = c.getContext('2d');
    cx.drawImage(video, sx, sy, side, side, 0, 0, IMG, IMG);
    const d = cx.getImageData(0, 0, IMG, IMG).data;
    const chw = new Float32Array(3 * IMG * IMG);
    for (let i = 0; i < IMG * IMG; i++) {
      chw[i] = d[i*4] / 255; chw[IMG*IMG + i] = d[i*4+1] / 255; chw[2*IMG*IMG + i] = d[i*4+2] / 255;
    }
    const tensor = new ort.Tensor('float32', chw, [1, 3, IMG, IMG]);
    const out = await session.run({ [session.inputNames[0]]: tensor });
    const det = out[session.outputNames[0]].data;
    const protos = out[session.outputNames[1]].data;
    const N = 8400, NM = 32;
    const boxes = [], scores = [], coeffs = [], classes = [];
    for (let i = 0; i < N; i++) {
      let best = 0, cls = -1;
      for (let cc = 0; cc < 80; cc++) {
        const s = det[(4 + cc) * N + i];
        if (s > best) { best = s; cls = cc; }
      }
      if (best < CONF) continue;
      const bx = det[i], by = det[N + i], bw = det[2*N + i], bh = det[3*N + i];
      // map from 640-square back to video coords (square center crop)
      const px = v => v / IMG * side;
      boxes.push([px(bx - bw/2) + sx, px(by - bh/2) + sy, px(bx + bw/2) + sx, px(by + bh/2) + sy]);
      scores.push(best); classes.push(cls);
      const cf = new Float32Array(NM);
      for (let m = 0; m < NM; m++) cf[m] = det[(84 + m) * N + i];
      coeffs.push(cf);
    }
    const keep = nms(boxes, scores);
    // draw
    overlay.width = vw; overlay.height = vh;
    octx.clearRect(0, 0, vw, vh);
    // guide: tall center rect (spine-like) — the geometry filter
    const gw = vw * 0.22, gh = vh * 0.62;
    const gx0 = (vw - gw) / 2, gy0 = (vh - gh) / 2, gx1 = gx0 + gw, gy1 = gy0 + gh;
    octx.strokeStyle = '#fff'; octx.lineWidth = 3; octx.setLineDash([12, 8]);
    octx.strokeRect(gx0, gy0, gw, gh);
    octx.setLineDash([]);
    // best detection = max IoU with guide (class ignored)
    let bestK = -1, bestIoU = 0;
    for (const k of keep) {
      const b = boxes[k];
      const ix = Math.max(0, Math.min(b[2], gx1) - Math.max(b[0], gx0));
      const iy = Math.max(0, Math.min(b[3], gy1) - Math.max(b[1], gy0));
      const inter = ix * iy;
      const union = (b[2]-b[0])*(b[3]-b[1]) + gw*gh - inter;
      const iou = union > 0 ? inter / union : 0;
      if (iou > bestIoU) { bestIoU = iou; bestK = k; }
    }
    let html = '';
    for (const k of keep) {
      const b = boxes[k], label = COCO[classes[k]] || ('c' + classes[k]);
      const isBook = label === 'book';
      const isBest = k === bestK;
      octx.strokeStyle = isBest ? '#ff0' : (isBook ? '#0f0' : '#f00');
      octx.lineWidth = isBest ? 6 : 4;
      octx.strokeRect(b[0], b[1], b[2] - b[0], b[3] - b[1]);
      octx.fillStyle = isBest ? '#ff0' : (isBook ? '#0f0' : '#f00');
      octx.font = 'bold 28px sans-serif';
      octx.fillText((isBest ? 'BEST ' : '') + label + ' ' + scores[k].toFixed(2), b[0] + 6, b[1] + 32);
      // mask overlay (threshold 0.65 for a tighter boundary)
      const cf = coeffs[k], mw = 160, mh = 160;
      const mCan = document.createElement('canvas'); mCan.width = mw; mCan.height = mh;
      const mctx = mCan.getContext('2d');
      const mImg = mctx.createImageData(mw, mh);
      let mmx0 = mw, mmy0 = mh, mmx1 = 0, mmy1 = 0;
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
        const p = y * mw + x;
        let s = 0;
        for (let m = 0; m < NM; m++) s += cf[m] * protos[m * mw * mh + p];
        if (sig(s) > 0.65) {
          mImg.data[p*4] = isBest ? 255 : (isBook ? 0 : 255);
          mImg.data[p*4+1] = 255; mImg.data[p*4+2] = 0; mImg.data[p*4+3] = 90;
          if (x < mmx0) mmx0 = x; if (x > mmx1) mmx1 = x;
          if (y < mmy0) mmy0 = y; if (y > mmy1) mmy1 = y;
        }
      }
      mctx.putImageData(mImg, 0, 0);
      octx.drawImage(mCan, b[0], b[1], b[2] - b[0], b[3] - b[1]);
      // tight mask bbox (maps mask coords back through the detection box)
      if (mmx1 > mmx0) {
        const tx = v => b[0] + (v / mw) * (b[2] - b[0]);
        const ty = v => b[1] + (v / mh) * (b[3] - b[1]);
        octx.strokeStyle = '#0ff'; octx.lineWidth = 3; octx.setLineDash([8, 6]);
        octx.strokeRect(tx(mmx0), ty(mmy0), tx(mmx1) - tx(mmx0), ty(mmy1) - ty(mmy0));
        octx.setLineDash([]);
      }
      html += '<div>' + (k === bestK ? '<b>BEST&gt; </b>' : '') + label + ' — ' + (scores[k]*100).toFixed(0) + '%</div>';
    }
    resultsEl.innerHTML = html || '<div>No detections</div>';
    setStatus('Done in ' + Math.round(performance.now() - t0) + 'ms. ' + keep.length + ' object(s).');
  } catch (e) {
    setStatus('Detection failed: ' + e.message, false);
  }
  detectBtn.disabled = false;
});
</script>
</body>
</html>
